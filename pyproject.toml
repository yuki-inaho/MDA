[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "mda"
version = "0.0.0"
description = "Modeling Depth Ambiguity: A Mixture-Density Representation for Flying-Point-Free Depth Estimation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Siyuan Bian", email = "siyuanb@nvidia.com" },
    { name = "Congrong Xu" },
    { name = "Jun Gao" },
]

dependencies = [
    "accelerate",
    "addict",
    "einops",
    "e3nn",
    "evo",
    "fastapi",
    "huggingface_hub",
    "imageio",
    "lightning-bolts",
    "matplotlib",
    "moviepy==1.0.3",
    "numpy<2",
    "omegaconf",
    "open3d",
    "opencv-python",
    "pillow",
    "pillow_heif",
    "plyfile",
    "pre-commit",
    "pycolmap",
    "pyyaml",
    "requests",
    "safetensors",
    "scipy",
    "setuptools<81",
    "sympy",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "trimesh",
    "tqdm",
    "typer>=0.9.0",
    "uvicorn",
    "xformers==0.0.31.post1",
]

[project.optional-dependencies]
app = ["gradio>=5", "pillow>=9.0"] # requires that python3>=3.10
# gsplat builds a CUDA extension and is not required for the demo path.
gs = []
train = ["hydra-core", "lightning", "rootutils", "torchmetrics", "peft", "rich"]
viz = ["rerun-sdk>=0.23.1"]
all = ["mda[app,viz]"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[project.scripts]
mda = "depth_anything_3.cli:app"

[project.urls]
Homepage = "https://biansy000.github.io/mda-site/"
Paper = "https://arxiv.org/abs/2606.02552"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/depth_anything_3"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/depth_anything_3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
plugins = ["jaxtyping.mypy_plugin"]

[tool.black]
line-length = 99
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  | \.git
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["bson","cruise","cv2","dataloader","diffusers","omegaconf","tensorflow","torch","torchvision","transformers","gsplat"]
known_first_party = ["common", "data", "models", "projects"]
sections = ["FUTURE","STDLIB","THIRDPARTY","FIRSTPARTY","LOCALFOLDER"]
skip_gitignore = true
line_length = 99
no_lines_before="THIRDPARTY"
